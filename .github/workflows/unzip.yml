name: Unzip
on: [push]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o "*.zip" || unzip -o "**/*.zip" || true
          rm -f *.zip **/*.zip || true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Unzip" || true
          git push
